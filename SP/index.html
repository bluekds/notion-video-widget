<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      max-width: 100%;
      max-height: 100dvh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <video id="vid" src="./video.mp4" autoplay loop muted playsinline controls></video>
  <script>
    const vid = document.getElementById('vid');

    // 페이지 로드 시 자동재생 보장 시도
    vid.play().catch(() => {});

    // 영상 본체를 클릭할 때 음소거/음소거 해제 토글 (컨트롤 바 클릭은 제외)
    vid.addEventListener('click', (e) => {
      if (e.target === vid) {
        vid.muted = !vid.muted;
        if (!vid.muted && vid.paused) {
          vid.play().catch(() => {});
        }
      }
    });
  </script>
</body>
</html>
