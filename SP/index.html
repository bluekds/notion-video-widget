<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <video id="vid" src="./video.mp4" autoplay loop muted playsinline controls></video>
  <script>
    const vid = document.getElementById('vid');
    // 영상 영역을 클릭하면 음소거/음소거 해제 토글 (컨트롤 바 클릭과 겹치지 않도록 처리)
    vid.addEventListener('click', (e) => {
      if (e.target === vid) {
        vid.muted = !vid.muted;
      }
    });
  </script>
</body>
</html>
